<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Station</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="overlay" hidden>
    <form id="loginForm" class="dialog login-dialog">
      <label>Username<input id="loginUser" type="text" autocomplete="username" value="admin" required></label>
      <label>Password
        <span class="password-field">
          <input id="loginPass" type="password" autocomplete="current-password" required>
          <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </span>
      </label>
      <div id="loginError" class="error" hidden>Wrong username or password</div>
      <button class="action-button primary login-submit" type="submit">Sign In</button>
    </form>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="wrap bar">
        <div>
          <div class="title">Weather Station</div>
          <div class="section-label" id="subtitle">LOCAL TEMPEST DATA</div>
        </div>
        <div class="header-status">
          <span class="connection"><span id="liveDot" class="dot"></span><span id="liveText">NO DATA</span></span>
          <span class="battery" title="Sensor battery"><span class="battery-meter"><span id="batteryFill" class="battery-fill"></span></span><span id="batteryText">--</span></span>
          <div class="menu-wrap" id="menuWrap">
            <button class="menu-button" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="appMenu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <nav class="app-menu" id="appMenu" aria-label="Main menu" hidden>
              <button type="button" data-panel="settings">Settings</button>
              <button type="button" data-panel="network">Network</button>
              <button type="button" data-panel="hardware">Hardware</button>
                            <button type="button" class="divider" id="logoutBtn">Log out</button>
                          </nav>
                        </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="banner" class="banner" hidden></div>

      <section class="panel-card status-card">
        <div class="section-label">CURRENT CONDITIONS <span id="obsAge" class="muted"></span></div>
        <div class="status-grid" id="status"></div>
      </section>

      <div class="range-row">
        <div class="section-label">HISTORY</div>
        <div class="seg" id="range"></div>
      </div>
      <section class="chart-grid" id="charts"></section>

      <footer class="footerbar">
        <span id="footInfo"></span>
        <span id="footVer"></span>
      </footer>
    </main>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="panel-card dialog wide">
      <div class="details-header"><span>Settings</span><button class="details-close" type="button" data-close-panel>Close</button></div>
      <div class="section-label">UNITS</div>
      <div class="unit-grid" id="units"></div>

      <div class="section-label">ACCOUNT</div>
      <form id="credentialsForm" class="settings-form">
        <label>Username<input id="credentialUser" type="text" autocomplete="username" maxlength="32" required></label>
        <label>New password<input id="credentialPassword" type="password" autocomplete="new-password" minlength="6" maxlength="64" required></label>
        <button class="action-button" type="submit">Save account</button>
      </form>
      <div id="credentialsMsg" class="muted small" role="status"></div>

      <div class="section-label">FIRMWARE UPDATE</div>
      <div class="inline-form">
        <input id="fwFile" type="file" accept=".bin">
        <button class="action-button" id="fwBtn">Upload</button>
      </div>
      <progress id="fwProgress" class="fw-progress" max="100" value="0" aria-label="Firmware upload progress" hidden></progress>
      <div id="fwMsg" class="muted small" role="status"></div>
      <div id="about" class="muted small"></div>
    </div>
  </div>

  <div id="network" class="overlay" hidden>
    <section class="panel-card dialog wide info-dialog">
      <div class="details-header"><span>Network</span><button class="details-close" type="button" data-close-panel>Close</button></div>
      <div id="networkContent" class="info-content muted">Loading...</div>
    </section>
  </div>

  <div id="hardware" class="overlay" hidden>
    <section class="panel-card dialog wide info-dialog">
      <div class="details-header"><span>Hardware</span><button class="details-close" type="button" data-close-panel>Close</button></div>
      <div id="hardwareContent" class="info-content muted">Loading...</div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
